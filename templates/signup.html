<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-page">

<header>
  <a class="brand" href="/">
    <span class="orb"></span>
    <h1>AI Assistant</h1>
  </a>
</header>

<main class="auth-main">
  <div class="auth-card">
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Sign up to start chatting</p>

    <div class="form-error" id="form-error"></div>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" placeholder="Your full name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" required />
      </div>
      <div class="field">
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="/login" id="switch-link">Log in</a></p>
  </div>
</main>

<script>
  const nextParam = new URLSearchParams(window.location.search).get("next");
  if (nextParam) {
    document.getElementById("switch-link").href = `/login?next=${encodeURIComponent(nextParam)}`;
  }
</script>

<script src="/static/js/auth.js"></script>
</body>
</html>
