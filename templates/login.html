<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-page">

<header>
  <a class="brand" href="/">
    <span class="orb"></span>
    <h1>AI Assistant</h1>
  </a>
</header>

<main class="auth-main">
  <div class="auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Log in to your account</p>

    <div class="form-error" id="form-error"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="/signup" id="switch-link">Sign up</a></p>
  </div>
</main>

<script>
  // Preserve ?next=... when switching to the sign up form, so a guest
  // sent here to check out doesn't lose their destination.
  const nextParam = new URLSearchParams(window.location.search).get("next");
  if (nextParam) {
    document.getElementById("switch-link").href = `/signup?next=${encodeURIComponent(nextParam)}`;
  }
</script>

<script src="/static/js/auth.js"></script>
</body>
</html>
