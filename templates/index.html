<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

<div id="app">
  <aside id="sidebar" hidden>
    <button id="newChatBtn" class="btn btn-primary btn-block">+ New chat</button>
    <div id="sessionList"></div>
  </aside>

  <div id="main">
    <header>
      <div class="brand">
        <span class="orb"></span>
        <h1>AI Assistant</h1>
      </div>
      <span class="status" id="statusText">Online</span>
      <span id="authArea"></span>
    </header>

    <div id="log"></div>

    <div id="composer">
      <div class="composer-inner">
        <button id="imageModeBtn" type="button" aria-label="Generate image" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </button>
        <textarea id="input" rows="1" placeholder="Type your message..."></textarea>
        <button id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="6 11 12 5 18 11"></polyline>
          </svg>
        </button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for new line</div>
    </div>
  </div>
</div>

<script src="../static/js/auth.js"></script>
<script src="../static/js/index.js"></script>
</body>
</html>
